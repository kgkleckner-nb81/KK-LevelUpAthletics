<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f19">
  <title>Ballpark Breakout | Level Up Athletics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game-shell" id="shell">
  <header class="topbar">
    <div class="brand"><div><span class="eyebrow">LEVEL UP ATHLETICS</span><h1>BALLPARK <em>BREAKOUT</em></h1></div></div>
    <button id="levels" class="stage-button" title="Choose a stage"><span class="eyebrow" id="stage-number">STAGE 01 / 08</span><strong id="stage-name">First pitch</strong><span class="stage-dots" id="stage-dots" aria-hidden="true"></span></button>
    <div class="scores"><div><span class="eyebrow">SCORE</span><strong id="score">0</strong></div><div class="best"><span class="eyebrow">STAGE BEST</span><strong id="best">0</strong></div></div>
    <nav class="tools" aria-label="Game controls"><button class="icon" id="sound" title="Turn sound on" aria-label="Turn sound on">♪</button><button class="icon" id="fullscreen" title="Full screen" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button class="icon" id="pause" title="Pause" aria-label="Pause">Ⅱ</button></nav>
  </header>
  <section class="arena" id="arena" aria-label="Game field">
    <canvas id="game" width="1600" height="900" tabindex="0" aria-label="Aim by dragging across the field and release to launch. Keyboard: arrows adjust aim and power; Space launches."></canvas>
    <div class="objective"><span class="target-icon" aria-hidden="true">◎</span><span id="objective">Clear every mascot</span><strong id="targets">0 / 2</strong></div>
    <div class="stage-tip" id="stage-tip"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="aim-hint" id="aim-hint">DRAG TO AIM <span>RELEASE TO LAUNCH</span></div>
    <div class="loading" id="loading"><strong>WARMING UP THE BALLPARK</strong><span>Loading the field...</span></div>
    <div class="modal-backdrop" id="overlay" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></section></div>
  </section>
  <footer class="control-bar">
    <div class="ammo"><span class="eyebrow">SHOTS LEFT</span><div id="ammo-balls"></div></div>
    <div class="ball-picker" id="ball-picker" aria-label="Ball type"></div>
    <div class="aim-controls"><label for="angle">ANGLE <output id="angle-value">24°</output></label><input id="angle" type="range" min="5" max="78" value="24" aria-label="Launch angle"><label for="power">POWER <output id="power-value">65%</output></label><input id="power" type="range" min="10" max="100" value="65" aria-label="Launch power"></div>
    <button id="launch" class="primary launch">LAUNCH <span aria-hidden="true">↗</span></button>
    <button id="retry" class="icon retry" title="Retry stage" aria-label="Retry stage">↻</button>
  </footer>
  <div class="subbar"><span id="level-description">Find the weak support. Let gravity do the rest.</span><span id="save-status">PROGRESS SAVED ON THIS DEVICE</span></div>
</main>
<script src="vendor/matter.min.js"></script>
<script src="physics.js"></script>
<script src="game.js"></script>
</body>
</html>
